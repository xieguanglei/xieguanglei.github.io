<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>一叶斋</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>一叶斋</h1>
        </header>
        <main class="post-list">
            <% posts.forEach(function(post) { %>
                <article class="post-item">
                    <h2><a href="/blog/<%= post.date %>/<%= post.postPath %>"><%= post.title %></a></h2>
                    <time><%= post.formattedDate %></time>
                </article>
            <% }); %>
        </main>
    </div>
</body>
</html>
