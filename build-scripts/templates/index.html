<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>一叶斋</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="layout">
        <%- include('sidebar.html') %>
        <main class="content">
            <div class="post-list">
                <% posts.forEach(function(post) { %>
                    <article class="post-item">
                        <time class="time"><%= post.formattedDate %></time>
                        <h2 class="title"><a href="/blog/<%= post.date %>/<%= post.postPath %>"><%= post.title %></a></h2>
                    </article>
                <% }); %>
            </div>
        </main>
    </div>
</body>
</html>
