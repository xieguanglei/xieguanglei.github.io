<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        <%= title %>
    </title>
    <meta name="description" content="<%= description || title %>">
    <meta name="keywords" content="<%= keywords ? keywords.join(', ') : '' %>">
    <meta name="author" content="xieguanglei">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div class="layout">
        <%- include('sidebar.html') %>
            <main class="main">
                <article class="article">
                    <div class="meta">
                        <time>
                            <%= date %>
                        </time>
                    </div>
                    <div class="content">
                        <%- content %>
                    </div>
                </article>

                <div id="disqus_thread" data-identifier="<%= title %>"></div>
                <script>
                    var disqus_config = function () {
                        this.page.url = location.href;
                        this.page.identifier = document.getElementById('disqus_thread').getAttribute('data-identifier'); // Replace PAGE_IDENTIFIER with your page's unique identifier variable
                    };
                    (function () { // DON'T EDIT BELOW THIS LINE
                        var d = document, s = d.createElement('script');
                        s.src = 'https://guanglei.disqus.com/embed.js';
                        s.setAttribute('data-timestamp', +new Date());
                        (d.head || d.body).appendChild(s);
                    })();
                </script>
            </main>
    </div>
    <style>
        .hljs-comment,
        .hljs-title {
            color: #8e908c
        }

        .hljs-variable,
        .hljs-attribute,
        .hljs-tag,
        .hljs-regexp,
        .ruby .hljs-constant,
        .xml .hljs-tag .hljs-title,
        .xml .hljs-pi,
        .xml .hljs-doctype,
        .html .hljs-doctype,
        .css .hljs-id,
        .css .hljs-class,
        .css .hljs-pseudo {
            color: #c82829
        }

        .hljs-number,
        .hljs-preprocessor,
        .hljs-pragma,
        .hljs-built_in,
        .hljs-literal,
        .hljs-params,
        .hljs-constant {
            color: #f5871f
        }

        .ruby .hljs-class .hljs-title,
        .css .hljs-rules .hljs-attribute {
            color: #eab700
        }

        .hljs-string,
        .hljs-value,
        .hljs-inheritance,
        .hljs-header,
        .ruby .hljs-symbol,
        .xml .hljs-cdata {
            color: #718c00
        }

        .css .hljs-hexcolor {
            color: #3e999f
        }

        .hljs-function,
        .python .hljs-decorator,
        .python .hljs-title,
        .ruby .hljs-function .hljs-title,
        .ruby .hljs-title .hljs-keyword,
        .perl .hljs-sub,
        .javascript .hljs-title,
        .coffeescript .hljs-title {
            color: #4271ae
        }

        .hljs-keyword,
        .javascript .hljs-function {
            color: #8959a8
        }

        .hljs {
            display: block;
            background: white;
            color: #4d4d4c;
            padding: .5em
        }

        .coffeescript .javascript,
        .javascript .xml,
        .tex .hljs-formula,
        .xml .javascript,
        .xml .vbscript,
        .xml .css,
        .xml .hljs-cdata {
            opacity: .5
        }
    </style>
    <!-- Cloudflare Web Analytics -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
        data-cf-beacon='{"token": "9b0def1d1ac3409daeac4177d3fcb125"}'></script><!-- End Cloudflare Web Analytics -->
</body>

</html>
